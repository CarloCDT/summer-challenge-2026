# 38-channel warm start from the best teacher - ARM B: VALUE FIX. See ppo_38ch_a_control.yaml
# for the four-arm layout; only the ARM block differs.
grid_height: null
max_turns: 100
opponent_strategy: level2Silver4
opponent_pool:
  self: 0.50
  level2Silver4: 0.25
  level2Silver3: 0.15
  level2Silver: 0.05
  level2Pro: 0.05
self_play_epsilon: 1.0
allow_skip_disrupt: true
force_disrupt: true
reward_mode: margin
win_bonus: 5000.0
score_norm: 1000.0
base_channels: 64
value_hidden: 256
num_iterations: 200
games_per_iteration: 64
num_workers: 32
gamma: 0.997
gae_lambda: 0.98
action_selection: onpolicy
clip_epsilon: 0.2
ppo_epochs: 2
minibatch_size: 256
entropy_coef: 0.001
lr: 0.00005
lr_end: 0.00001
eval_episodes: 200
eval_max_turns: 100
eval_bosses: level2Silver,level2Silver2,level2Silver3,level2Silver4
checkpoint_every: 25
checkpoint_dir: checkpoints
init_checkpoint: checkpoints/20260913-065817_iter200.pt
log_dir: null
device: null
seed: null

# ---- ARM B: value fix
# Measured on 065817_iter200 vs level2Silver4: value-loss gradient norm ~32 against ~7 for the
# policy, near-orthogonal, and every minibatch clipped at 0.5 - the shared encoder was trained
# almost entirely by the critic. Regressing return/3 (returns have sd ~2.9) cuts the value
# gradient ~9x to ~3.6, so the policy leads the trunk. The warm-started head is rescaled by 1/3
# on load, so its predictions are unchanged. Watch train/grad_norm_policy vs grad_norm_value.
critic: shared
value_scale: 3.0
value_coef: 0.5
max_grad_norm: 10.0                  # pre-clip total should sit ~8; this only catches outliers
shaping_coef: 0.0
