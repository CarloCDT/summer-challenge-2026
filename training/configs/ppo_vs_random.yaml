# PPO against the random baseline opponent (places random legal tracks, sometimes disrupts).
# A step up from ppo.yaml's passive default; "boss" is the strongest shipped opponent.
#
# Run: python3 -m training.train_ppo --config training/configs/ppo_vs_random.yaml

grid_height: null
max_turns: 20
opponent_strategy: random
num_iterations: 8000
games_per_iteration: 16
num_workers: 16
gamma: 0.99
gae_lambda: 0.95
epsilon_start: 0.2
epsilon_end: 0.05
clip_epsilon: 0.2
ppo_epochs: 4
minibatch_size: 128
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
lr: 0.0003
checkpoint_every: 50
checkpoint_dir: checkpoints
init_checkpoint: null
log_dir: null
device: null
seed: null
