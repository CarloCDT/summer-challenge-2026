# PPO against level2ProMax on SHORT 50-turn episodes, evaluated on the full 100-turn game.
#
# Same 28-channel setup as ppo_28ch_level2Pro.yaml, warm-started from that run's
# checkpoints/20260910-184004_iter400.pt instead of starting cold, and stepped up to
# level2ProMax (level2Pro's autoplace-and-commit build, plus: inks the region where enemy
# track most outnumbers its own, once that lead is > 1 - ties break to the lowest zone id).
#
# CAUTION - level2ProMax is a cliff, not a gradual step up from level2Pro. Per CLAUDE.md, the
# best teacher measured so far scored +8998 on level2Pro and -5508 on level2ProMax (win 0.05,
# connections completed falling from 100% to 42%). It finishes building around turn 25 then
# spends the rest of the game purely inking, and only ~14% of the board (buildable cells in
# town regions) is permanently safe from that. Expect the eval/level2ProMax margin to look
# ugly for a long time before (if) it turns around - that is the documented shape of this
# opponent, not evidence the run is broken.
#
# READ THIS BEFORE TRUSTING THE EVAL TABLE: training episodes stop at turn 50, so the turn
# channel only ever spans 0.00-0.50 during training, while the 100-turn eval drives it to
# 1.00. level2ProMax's inking phase (turn ~25 onward) IS inside the training window this
# time, unlike the 20-turn level1Pro/level2Pro configs, but the last half of the eval game is
# still never seen in training.
#
# Run: python3 -u -m training.train_ppo --config training/configs/ppo_28ch_level2ProMax.yaml

# --- Environment ---
grid_height: null                 # null = the authentic random size (h 14..20, w = round(h*1.5))
max_turns: 50                     # SHORT training episode - eval still runs the full 100
opponent_strategy: level2ProMax   # level2Pro's build + inks the region with the biggest enemy
                                  # track lead (> 1), deterministic tie-break to lowest zone id
allow_skip_disrupt: true          # the agent may decline to disrupt

reward_mode: margin               # own score gain minus the opponent's, per turn. Both players
                                  # score on the SAME shared connection, so this also discourages
                                  # completing a route whose path is mostly the opponent's track -
                                  # that pays them more than it pays you.

# --- Network (RailroadUNet: 2 down / 2 up, conv before and after, critic off the bottleneck) ---
base_channels: 64
value_hidden: 256

# --- PPO (the tuning that stabilised ppo_full.yaml: approx_kl 0.19 -> ~0.06) ---
num_iterations: 1_000
games_per_iteration: 64
num_workers: 32
gamma: 0.99
gae_lambda: 0.95
epsilon_start: 0.25                # lower than a cold start's 0.5 - the warm-started policy
epsilon_end: 0.05                 # already builds sensible corridors, so less random disruption
                                  # of them is needed to keep exploring.
clip_epsilon: 0.2
ppo_epochs: 2
minibatch_size: 256
value_coef: 0.5
entropy_coef: 0.001
max_grad_norm: 0.5
lr: 0.0001
lr_end: 0.0                       # annealed linearly to ~0 over the run
score_norm: 1000.0                # per-turn margins are divided by this before GAE

# --- Evaluation (runs right after each checkpoint save, printed to the terminal and logged to
# TensorBoard as eval/<boss>/*). Greedy, on a fixed set of maps, so successive tables differ
# because the agent changed rather than because the maps did. All four tiers are kept even though
# training only sees level2ProMax - that is what catches overfitting to this one opponent.
eval_episodes: 100
eval_max_turns: 100               # the PRODUCTION length, deliberately != max_turns here. A
                                  # short eval would rank checkpoints on a game you never
                                  # play: it rewards racing to one cheap connection, while a
                                  # 100-turn optimum builds infrastructure for later.
eval_bosses: level1,level1Pro,level2,level2Pro,level2ProMax

# --- Bookkeeping ---
checkpoint_every: 100
checkpoint_dir: checkpoints
init_checkpoint: checkpoints/20260910-184004_iter400.pt
log_dir: null
device: null
seed: null
